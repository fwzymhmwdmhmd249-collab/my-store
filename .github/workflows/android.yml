name: Build Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Install Dependencies
        working-directory: mf_foods
        run: flutter pub get

      - name: Analyze
        working-directory: mf_foods
        run: flutter analyze

      - name: Build APK (Debug)
        working-directory: mf_foods
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MF-Foods-APK
          path: mf_foods/build/app/outputs/flutter-apk/app-debug.apk