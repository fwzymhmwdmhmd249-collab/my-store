<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>📱 متجر العميل الحي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f9fa; margin: 0; padding: 20px; text-align: right; color: #333; }
        .box { background: white; padding: 25px; max-width: 450px; margin: 30px auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        input, select { width: 95%; padding: 12px; margin: 10px 0; border: 1px solid #ced4da; border-radius: 8px; font-size: 15px; display: block; }
        button { background-color: #007bff; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-secondary { background-color: #6c757d; }
        .btn-order { background-color: #28a745; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1000px; margin: 20px auto; }
        .product-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); text-align: center; border: 1px solid #e9ecef; }
        .price { font-size: 20px; color: #28a745; font-weight: bold; margin: 10px 0; }
        .status-in { color: #28a745; font-weight: bold; }
        .status-out { color: #dc3545; font-weight: bold; }
        .user-bar { background: #212529; color: white; padding: 12px 20px; border-radius: 8px; max-width: 1000px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="user-bar" id="user_bar" style="display: none;">
        <span>👋 مرحباً بك: <b id="client_welcome_name">ضيف</b></span>
        <button style="background:#dc3545; width:auto; padding:5px 15px; margin:0;" onclick="logout()">خروج 🚪</button>
    </div>

    <div class="box" id="main_auth_box">
        <h3 style="text-align: center; color: #007bff; margin-top:0;">🛒 أهلاً بك في المتجر</h3>
        <button onclick="showScreen('login_box')">🔐 تسجيل الدخول بحسابي</button>
        <button onclick="showScreen('register_box')">📝 إنشاء حساب جديد</button>
        <button class="btn-secondary" onclick="enterAsGuest()">👤 الدخول كـ زائر</button>
    </div>

    <div class="box" id="login_box" style="display: none;">
        <h3>🔐 تسجيل الدخول</h3>
        <input type="tel" id="login_phone" placeholder="رقم الهاتف">
        <input type="password" id="login_password" placeholder="كلمة المرور">
        <button onclick="loginProcess()">دخول 🚀</button>
        <button class="btn-secondary" onclick="showScreen('forgot_box')">🤔 نسيت كلمة المرور؟</button>
        <button class="btn-secondary" onclick="showScreen('main_auth_box')">🔙 رجوع</button>
    </div>

    <div class="box" id="register_box" style="display: none;">
        <h3>📝 بيانات الحساب الشحن الجديد</h3>
        <input type="text" id="reg_name" placeholder="الاسم بالكامل">
        <input type="tel" id="reg_phone" placeholder="رقم الهاتف">
        <input type="password" id="reg_password" placeholder="اختر كلمة مرور">
        <select id="reg_city">
            <option value="">اختر المحافظة</option>
            <option value="القاهرة">القاهرة</option>
            <option value="الجيزة">الجيزة</option>
            <option value="الإسكندرية">الإسكندرية</option>
            <option value="سوهاج">سوهاج</option>
        </select>
        <input type="text" id="reg_area" placeholder="المنطقة / الحي">
        <input type="text" id="reg_address" placeholder="العنوان بالتفصيل">
        
        <p style="font-size: 13px; color: #dc3545; font-weight: bold; margin-bottom: 0;">🔒 سؤال الأمان لاسترجاع حسابك لاحقاً:</p>
        <select id="reg_question">
            <option value="ما هو اسم أول مدرس لك؟">ما هو اسم أول مدرس لك؟</option>
            <option value="ما هي مدينتك المفضلة؟">ما هي مدينتك المفضلة؟</option>
        </select>
        <input type="text" id="reg_answer" placeholder="إجابة السؤال السري">
        
        <button onclick="registerProcess()">تأكيد الحساب والفتح 🎉</button>
        <button class="btn-secondary" onclick="showScreen('main_auth_box')">🔙 رجوع</button>
    </div>

    <div class="box" id="forgot_box" style="display: none;">
        <h3>🔄 استرجاع وتعديل الباسورد</h3>
        <input type="tel" id="forgot_phone" placeholder="رقم هاتفك المسجل">
        <button onclick="checkForgotPhone()">فحص وتأكيد الرقم 🔍</button>
        <div id="forgot_step2" style="display: none; margin-top: 15px;">
            <p id="forgot_question_text" style="color:#007bff; font-weight:bold;"></p>
            <input type="text" id="forgot_answer" placeholder="اكتب الإجابة السرية">
            <input type="password" id="forgot_new_password" placeholder="كلمة المرور الجديدة">
            <button onclick="resetPasswordProcess()">تحديث الباسورد والدخول فوراً 🔓</button>
        </div>
        <button class="btn-secondary" onclick="showScreen('login_box')" style="margin-top:10px;">🔙 رجوع</button>
    </div>

    <div id="store_section" style="display: none;">
        <h2 style="text-align:center; color:#212529;">📦 المعروضات المتوفرة بالمخزن حالياً</h2>
        <div class="grid" id="products_container">جاري جلب البضاعة الحية من السيرفر...</div>
    </div>

    <script>
        // تم ربط مفاتيح مشروعك هنا بنجاح 
        const firebaseConfig = {
            apiKey: "AIzaSyC3CH3NkVc34auhVnLeZTVFVlaiMpphhPY",
            authDomain: "my-store-94782.firebaseapp.com",
            projectId: "my-store-94782",
            storageBucket: "my-store-94782.firebasestorage.app",
            messagingSenderId: "676676616216",
            appId: "1:676676616216:web:f6a8941249bc910772436d",
            measurementId: "G-BW011482T9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let isGuest = false; let currentUserData = null;

        function showScreen(id) {
            document.getElementById('main_auth_box').style.display = 'none';
            document.getElementById('login_box').style.display = 'none';
            document.getElementById('register_box').style.display = 'none';
            document.getElementById('forgot_box').style.display = 'none';
            document.getElementById(id).style.display = 'block';
        }

        function enterAsGuest() {
            isGuest = true; currentUserData = null;
            document.getElementById('main_auth_box').style.display = 'none';
            document.getElementById('store_section').style.display = 'block';
            document.getElementById('user_bar').style.display = 'flex';
            document.getElementById('client_welcome_name').innerText = "زائر / ضيف 👤";
            loadProductsLive();
        }

        async function registerProcess() {
            let phone = document.getElementById('reg_phone').value.trim();
            let name = document.getElementById('reg_name').value.trim();
            let password = document.getElementById('reg_password').value;
            let city = document.getElementById('reg_city').value;
            let area = document.getElementById('reg_area').value.trim();
            let address = document.getElementById('reg_address').value.trim();
            let question = document.getElementById('reg_question').value;
            let answer = document.getElementById('reg_answer').value.trim().toLowerCase();

            if(!phone || !name || !password || !city || !area || !address || !answer) return alert("يرجى ملء جميع البيانات!");
            let userCheck = await db.collection("users").doc(phone).get();
            if(userCheck.exists) return alert("هذا الرقم مسجل بالفعل!");

            let userData = { phone, name, password, city, area, address, question, answer };
            await db.collection("users").doc(phone).set(userData);
            currentUserData = userData; isGuest = false;
            completeLogin();
        }

        async function loginProcess() {
            let phone = document.getElementById('login_phone').value.trim();
            let password = document.getElementById('login_password').value;
            let userDoc = await db.collection("users").doc(phone).get();
            if(!userDoc.exists) return alert("الرقم غير مسجل!");
            let user = userDoc.data();
            if(user.password !== password) return alert("كلمة المرور خاطئة!");
            currentUserData = user; isGuest = false;
            completeLogin();
        }

        function completeLogin() {
            document.getElementById('main_auth_box').style.display = 'none';
            document.getElementById('login_box').style.display = 'none';
            document.getElementById('store_section').style.display = 'block';
            document.getElementById('user_bar').style.display = 'flex';
            document.getElementById('client_welcome_name').innerText = currentUserData.name;
            loadProductsLive();
        }

        function loadProductsLive() {
            db.collection("products").onSnapshot((snapshot) => {
                const container = document.getElementById('products_container');
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    let p = doc.data(); let isAvailable = p.quantity > 0;
                    container.innerHTML += `
                        <div class="product-card">
                            <h3>${p.name}</h3>
                            <p class="price">${p.price} جنيه</p>
                            <p>${isAvailable ? '<span class="status-in">🟢 متوفر بالمخزن</span>' : '<span class="status-out">❌ نفدت الكمية</span>'}</p>
                            <button class="btn-order" ${!isAvailable ? 'disabled' : ''} onclick="buyProduct('${doc.id}', '${p.name}', ${p.quantity})">طلب شراء فوري 🛒</button>
                        </div>`;
                });
            });
        }

        async function buyProduct(id, prodName, currentQty) {
            let name, phone, address;
            if(isGuest) {
                name = prompt("اكتب اسمك للشحن:"); phone = prompt("رقم تليفونك:"); address = prompt("عنوانك بالكامل:");
                if(!name || !phone || !address) return alert("البيانات مطلوبة لإتمام الشحن!");
            } else {
                name = currentUserData.name; phone = currentUserData.phone;
                address = `${currentUserData.city}، ${currentUserData.area}، ${currentUserData.address}`;
            }
            await db.collection("orders").add({ name, phone, address, product: prodName, time: new Date().toLocaleString('ar-EG') });
            await db.collection("products").doc(id).update({ quantity: currentQty - 1 });
            alert("🎉 تم إرسال الأوردر بنجاح ووصل للأدمن لحظياً!");
        }

        async function checkForgotPhone() {
            let phone = document.getElementById('forgot_phone').value.trim();
            let userDoc = await db.collection("users").doc(phone).get();
            if(!userDoc.exists) return alert("الرقم غير موجود بسجلاتنا!");
            let user = userDoc.data();
            document.getElementById('forgot_question_text').innerText = `السؤال السري: (${user.question})`;
            document.getElementById('forgot_step2').style.display = 'block';
        }

        async function resetPasswordProcess() {
            let phone = document.getElementById('forgot_phone').value.trim();
            let answer = document.getElementById('forgot_answer').value.trim().toLowerCase();
            let newPass = document.getElementById('forgot_new_password').value;
            let userDoc = await db.collection("users").doc(phone).get();
            let user = userDoc.data();

            if(user.answer !== answer) return alert("الإجابة السرية غير صحيحة!");
            if(!newPass) return alert("اكتب الباسورد الجديدة!");

            await db.collection("users").doc(phone).update({ password: newPass });
            alert("🔐 تم تحديث وتغيير الباسورد بنجاح!");
            currentUserData = { ...user, password: newPass }; isGuest = false;
            document.getElementById('forgot_box').style.display = 'none';
            completeLogin();
        }
        function logout() { location.reload(); }
    </script>
</body>
</html>
